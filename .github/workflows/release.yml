name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: npm run lint && npm run typecheck && npm run test:run

      - name: Build
        run: npm run build

      - name: Dry-run package
        run: npm pack --dry-run

      - name: Evaluate release hardening gates
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          npm run release:hardening -- \
            --strict-signing \
            --signing-key-env RELEASE_SIGNING_KEY \
            --report ./logs/release_hardening/report.json \
            --sbom ./logs/release_hardening/sbom.json \
            --signature ./logs/release_hardening/signature.json \
            --release-workflow ./.github/workflows/release.yml

      - name: Upload release hardening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-hardening-artifacts
          path: |
            logs/release_hardening/report.json
            logs/release_hardening/sbom.json
            logs/release_hardening/signature.json

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
