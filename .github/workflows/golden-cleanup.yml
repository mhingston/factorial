name: Golden Principles Cleanup

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sundays at 02:00 UTC
  workflow_dispatch:  # Allow manual trigger
    inputs:
      auto_fix:
        description: 'Apply auto-fixes'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Golden Principles Audit
        id: audit
        run: |
          npm run golden:audit -- \
            --report logs/golden-principles/weekly-report.json \
            --verbose
        continue-on-error: true

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: golden-principles-audit-report
          path: logs/golden-principles/weekly-report.json

      - name: Check Audit Results
        run: |
          if [ "${{ steps.audit.outcome }}" == "failure" ]; then
            echo "::warning::Golden principles audit found violations"
          fi

  auto-fix:
    runs-on: ubuntu-latest
    needs: audit
    if: github.event.inputs.auto_fix != 'false'
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Auto-Fixes
        run: |
          npm run golden:fix -- \
            --report logs/golden-principles/fix-report.json

      - name: Run Verification Suite
        run: |
          npm run lint
          npm run typecheck
          npm run test:run

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: apply golden principles auto-fixes'
          title: 'chore: automated golden principles cleanup'
          body: |
            ## Automated Golden Principles Cleanup

            This PR applies automated fixes for golden principles violations.

            ### Changes Applied
            - Auto-fixes for principles marked as `auto_fixable: true`
            - See `logs/golden-principles/fix-report.json` for details

            ### Verification
            - [ ] `npm run lint` passes
            - [ ] `npm run typecheck` passes
            - [ ] `npm run test:run` passes

            ### Manual Review Required
            Please review the changes carefully, even for "safe" auto-fixes.

            **Generated by:** Golden Principles Cleanup workflow
          branch: chore/golden-principles-cleanup
          delete-branch: true
          add-paths: |
            **/*.ts
            **/*.js
            logs/golden-principles/*.json

  diff-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        run: |
          changed_files=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(ts|js|md)$' | tr '\n' ',')
          echo "files=$changed_files" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Diff-Only Audit
        if: steps.changed-files.outputs.files != ''
        run: |
          npm run golden:audit -- \
            --diff-only \
            --changed-files "${{ steps.changed-files.outputs.files }}" \
            --report logs/golden-principles/pr-report.json
