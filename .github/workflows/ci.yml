name: CI

on:
  push:
  pull_request:

jobs:
  pr-compound-compliance:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate PR compound artifacts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run check:pr-compound

  verify:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: DTU Scenario Harness
        if: ${{ matrix.node-version == 20 }}
        run: npm run dtu:run

      - name: Coverage Gate
        if: ${{ matrix.node-version == 20 }}
        run: npm run test:coverage

      - name: Upload Coverage Artifact
        if: ${{ matrix.node-version == 20 }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

  golden-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Golden Regression
        run: npm run test:golden

  worktree-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Worktree Parity
        env:
          WORKTREE_PARITY_REQUIRE_HEAD: "1"
        run: npm run test:worktree
